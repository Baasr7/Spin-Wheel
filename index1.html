<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin the Wheel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Link to your external stylesheet -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Include the Tone.js library for sound -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
</head>
<body>

    <!-- Main view for the wheel -->
    <div class="wheel-view">
        <!-- UPDATED: New container for side-by-side layout -->
        <div class="title-and-wheel-container">
            <h1 class="side-title">Spin</h1>
            <div class="wheel-wrapper" id="wheel-clickable-area">
                <div class="pointer"></div>
                <canvas id="wheel"></canvas>
            </div>
            <h1 class="side-title">Wheel</h1>
        </div>
        <div id="winner-display"></div>
    </div>

    <!-- Section for user options -->
    <div class="options-section">
        <div class="options-content">
            <h2>Enter Options</h2>
            <textarea id="options-input" placeholder="Enter one option per line...">Option 1&#10;Option 2&#10;Option 3&#10;Option 4&#10;Option 5&#10;Option 6</textarea>
        </div>
    </div>

    <!-- Link to your external JavaScript file -->
    <!-- The 'defer' attribute ensures the script runs after the HTML is loaded -->
    <script src="script.js" defer></script>
</body>
</html>
